name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  login-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Đăng nhập vào GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}